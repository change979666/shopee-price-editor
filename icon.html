<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <rect width="128" height="128" fill="url(#grad)"/>
    <defs>
      <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
      </linearGradient>
    </defs>
    <text x="64" y="75" font-size="60" fill="white" text-anchor="middle" font-family="Arial, sans-serif">💰</text>
    <text x="64" y="105" font-size="16" fill="white" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">价格</text>
  </svg>
</body>
</html>
