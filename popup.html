<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虾皮价格批量修改器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>🛒 虾皮价格批量修改器</h1>
    
    <div class="info-box">
      <p>此插件可以批量修改当前页面所有折扣价格</p>
    </div>

    <div class="form-group">
      <label>
        <input type="radio" name="operation" value="decrease" checked>
        <span>减少价格</span>
      </label>
      <label>
        <input type="radio" name="operation" value="increase">
        <span>增加价格</span>
      </label>
    </div>

    <div class="form-group">
      <label for="amount">调整金额:</label>
      <input type="number" id="amount" placeholder="请输入调整金额" min="0" step="0.01" value="10">
      <span class="unit">元</span>
    </div>

    <div class="button-group">
      <button id="applyBtn" class="btn btn-primary">批量修改价格</button>
      <button id="resetBtn" class="btn btn-secondary">重置</button>
    </div>

    <div class="button-group">
      <button id="debugBtn" class="btn btn-debug">🔍 调试模式</button>
    </div>

    <div id="result" class="result-box"></div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">找到价格输入框:</span>
        <span id="foundCount" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">成功修改:</span>
        <span id="modifiedCount" class="stat-value">0</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
